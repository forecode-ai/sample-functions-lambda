name: deploy-stage

# Reusable: build and deploy the functions to one stage.
on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
    env:
      SIMULATE: ${{ vars.LIVE_DEPLOYS != 'true' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        if: vars.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Deploy with SAM
        run: |
          source .github/simulate.sh
          sam build --use-container
          sam deploy --config-env "${{ inputs.stage }}" --no-confirm-changeset --no-fail-on-empty-changeset
