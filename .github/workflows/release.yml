name: release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "25 23 * * 1-5"
  workflow_dispatch:
    inputs:
      production:
        description: Also deploy to production (needs approval)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit tests
        run: python3 -m unittest discover -s tests -t .

  staging:
    if: github.event_name != 'pull_request'
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: staging

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.production
    needs: staging
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-stage.yml
    with:
      stage: production
